name: Build NoteLedger

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check frontend
        run: npm run check

      - name: Frontend unit tests
        run: npm test

  rust:
    # Runs on macOS so the tauri crate builds against the OS WebKit — no GTK/glib
    # system packages to install (which is brittle on Linux runners).
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy (non-blocking)
        working-directory: src-tauri
        run: cargo clippy --lib || true

  build:
    needs: [frontend, rust]
    # Windows .exe (NSIS) installer only. To build other platforms again, add
    # matrix entries (macos-latest / aarch64-apple-darwin, ubuntu-22.04 /
    # x86_64-unknown-linux-gnu + its apt dependencies) and widen `bundles`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      # --bundles overrides tauri.conf.json's "targets": "all" (kept for local
      # builds, e.g. the macOS .dmg).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NoteLedger-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
